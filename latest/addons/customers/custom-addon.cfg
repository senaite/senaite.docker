[buildout]
develop +=
eggs +=
[instance]
# 修复建站失败：pip 装进 site-packages 的 zope.* 带的 *-nspkg.pth 会在解释器
# 启动时往 sys.modules 塞一个只含 site-packages 路径的假 zope 模块，
# eggs 里的 zope.processlifetime 因此不可见。buildout 自动建站走的
# `bin/instance run` 子进程不 import pkg_resources，于是静默失败：
# buildout 不报错、实例照常启动，但站点没建出来，/SITE 返回 404。
# 先 import pkg_resources 即可把命名空间补齐。
#
# 注：镜像里的 buildout.cfg 也加了同样的一行，但本文件是从宿主挂载
# 进去的，所以不重建镜像也能生效（容器启动时会重跑 buildout）。
initialization =
    import pkg_resources
zcml +=
