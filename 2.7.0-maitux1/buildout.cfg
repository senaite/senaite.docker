[buildout]
index = https://pypi.org/simple/
allow-hosts =
  pypi.org
  pypi.python.org
  files.pythonhosted.org
  pypi.tuna.tsinghua.edu.cn
  dist.plone.org
find-links =
  file:///home/senaite/wheelhouse
  https://dist.plone.org/release/5.2.15/
  https://dist.plone.org/thirdparty/
extends =
  buildout-base.cfg
  common-addons.cfg
  custom-addon.cfg
extensions = mr.developer

var-dir=/data
user=admin:Maitux=123456

effective-user = senaite
buildout-user = senaite

eggs-directory=eggs
download-cache=../buildout-cache/downloads

parts +=
  plonesite
  console_scripts

eggs +=
    RelStorage
    psycopg2
    senaite.lims
    senaite.databox
    senaite.storage
    senaite.patient
    senaite.ldap

sources = sources
auto-checkout = *

# All UPSTREAM packages are pinned to an exact commit (mr.developer's `rev=`).
# `branch=2.x` (as still used in ../latest) re-resolves to whatever upstream has
# pushed at build time: that is how the spotlight search silently turned into a
# modal overlay and how senaite.storage appeared in the sidebar, with no change
# on our side. The revisions below are the ones verified working together in the
# 2.7.0-maitux1 image.
#
# Our OWN forks (senaite.core, senaite.lims) are DELIBERATELY left on
# `branch=2.x`: they are still under active bug-fixing, and they only ever
# change when we push to them -- so they cannot surprise us the way an upstream
# branch can. Pin them (to a commit or a tag) when this release is actually
# frozen for production.
#
# NOTE: senaite.core is on the 2.7.0 *development* line, which upstream has not
# released yet -- that is why the upstream packages are pinned to commits rather
# than to released versions in versions.cfg. Once upstream ships 2.7.0, these
# can be replaced with plain version pins in versions.cfg (see senaite.lims'
# own "Pinned versions for 2.6.0" commit for the pattern upstream uses).
#
# To bump an upstream package: change its `rev=`, rebuild, verify. Once this
# directory has been deployed to production, leave it alone and create the next
# version directory (2.7.0-maitux2, ...) instead.
#
# Do NOT combine `rev=` with `branch=` on the same line; mr.developer warns and
# the intent becomes ambiguous.
[sources]
senaite.core = git https://github.com/NingboMaiTux/senaite.core.git branch=2.x
senaite.app.listing = git https://github.com/senaite/senaite.app.listing.git rev=1bd8490682ad6eda78a1351defbbb9e6a0957827
senaite.app.spotlight = git https://github.com/senaite/senaite.app.spotlight.git rev=40d1f136f6352fcf4a888ad50175d20c5b78c747
senaite.app.supermodel = git https://github.com/senaite/senaite.app.supermodel.git rev=d54a09e0962f50bcc167fb8dc6b0755375b2c071
senaite.impress = git https://github.com/senaite/senaite.impress.git rev=889778c9605d5345316f0b10767da49792b1b731
senaite.jsonapi = git https://github.com/senaite/senaite.jsonapi.git rev=ea7d780e1bcaa9a2f970e7e615b6c11bf11af6d6
senaite.lims = git https://github.com/NingboMaiTux/senaite.lims.git branch=2.x
senaite.databox = git https://github.com/senaite/senaite.databox.git rev=0d1fee20b3f658a225911eacaa0f98e673a31bb8
senaite.storage = git https://github.com/senaite/senaite.storage.git rev=704e172f490b48811bb4eacc6201ca0a857cc9a7
senaite.patient = git https://github.com/senaite/senaite.patient.git rev=3e2d9c26a23d5a526b82585bc2a1d01144ff0824
senaite.ldap = git https://github.com/senaite/senaite.ldap.git rev=459f8ceb25652ba98c868ec1928954349d56f579

[client1]
recipe =

[instance]
# taken from https://github.com/plone/plone.docker/blob/master/5.2/5.2.5/python2/buildout.cfg
rel-storage =
    type postgresql
    host postgres
    dbname lims_db
    user lims_user
    password Maitux=123456
    blob-dir /data/blobstorage
    shared-blob-dir true
event-log-handler = StreamHandler
event-log-args = (sys.stderr,)
access-log-handler = StreamHandler
access-log-args = (sys.stdout,)

[console_scripts]
recipe = zc.recipe.egg:scripts
eggs = senaite.core

[plonesite]
recipe = collective.recipe.plonesite
instance = instance
site-id = MaiLIMS
profiles-initial = Products.CMFPlone:dependencies
profiles =
    senaite.lims:default
upgrade-portal = False
upgrade-all-profiles = False
enabled = False

[versions]
setuptools =
zc.buildout =
RelStorage = 3.5.0
psycopg2 = 2.8.6
perfmetrics = 3.2.0
