[buildout]
develop +=
    /opt/addons/common/maitux.auditjournal
    /opt/addons/common/maitux.branding
    /opt/addons/common/maitux.capabilityinventory
    /opt/addons/common/maitux.loginhelpdisable
    /opt/addons/common/maitux.setuptitles
eggs +=
    maitux.auditjournal
    maitux.branding
    maitux.capabilityinventory
    maitux.loginhelpdisable
    maitux.setuptitles

# ★★ 下面这段 [plonesite] 目前是**死代码**，不要依赖它。★★
#
# 2026-08-31 用 `buildout -N annotate plonesite` 实测（容器内）：
#
#     profiles= senaite.lims:default
#         buildout.cfg
#
# 来源只标了 buildout.cfg，本文件这 6 行**一条都没进去**。原因是
# buildout.cfg `extends` 本文件之后，又用**普通赋值**重新定义了
# [plonesite] profiles —— extends 的语义是「扩展方覆盖被扩展方」，
# 于是这里写什么都被整个丢弃。CLAUDE.md §5 记的 custom-addon.cfg
# 是同一个坑，gen-custom-addon.sh 因此干脆不生成这一段。
#
# ⚠️ 更正（2026-08-31 复查）：曾在这里写过「buildout.cfg 里 enabled = False，
# plonesite part 根本不执行」—— **那句话对 buildout.cfg 成立，对实际运行环境不成立。**
#
# 容器启动跑的不是 buildout.cfg，是 custom.cfg（docker-entrypoint.sh:56
# `buildout -c custom.cfg -o -n`）。custom.cfg 由 docker-initialize.py 的
# PLONESITE_TEMPLATE 生成，只要 compose 里有 `SITE` 环境变量就写入
# `enabled = true`，把 buildout.cfg 的 False 覆盖掉。实测：
#
#     buildout -c custom.cfg -N annotate plonesite
#     → enabled= true
#           custom.cfg
#
# 启动日志同样印证（每次重启都有）：
#     Installing plonesite.
#     WARNING: A Plone Site already exists and will not be replaced
#     INFO: Running profiles: ['senaite.lims:default']
#
# 也就是说 **plonesite part 每次启动都在跑，profiles 每次都被重放**
# —— recipe 的 `if profiles: runProfiles(...)`（plonesite.py:330）不看站点是否
# 新建，且 `dependency_strategy='reapply'` 写死在 :75。这正是
# 根目录 `容器重启会写数据库-问题说明.md` 记的「每次重启写 82 行」那条链。
#
# 所以把本段修活**不是无副作用的**：重启时重放的 profile 会从 1 个变成 6 个，
# 其中包含唯一带独立 PostgreSQL 表的 maitux.auditjournal。
#
# 另外两条天花板，决定了这条通道即使修活也解决不了原问题：
#   * recipe 只认一个 `site-id = MaiLIMS`。本机有 4 个站点
#     （MaiLIMS / InnoCare / Care / lims4），另外 3 个一行都吃不到。
#   * recipe 用 `subprocess.call` 不检查返回码，失败永远静默。
# 两份问题说明各自独立得出过同一结论：**建站/装 profile 要用显式脚本，
# 别依赖这个 recipe。**
#
# 结论：**新建站点不会自动装任何 addon 的 profile**，这 5 个包全都要在
# SENAITE 后台手工装一次。保留本段只为与既有包保持一致，**不要依赖它，
# 也不要为了「让它生效」而随手改 buildout.cfg**。
#
# 若将来仍决定修活，已实测过的两点备查（2026-08-31，用一次性副本 annotate）：
#   * 把 buildout.cfg 的 `profiles =` 改成 `+=` 确实生效，来源标注会出现
#     common-addons.cfg，6 个 profile 齐全；
#   * 但 `senaite.lims:default` 会重复两次（本文件列表里一次、buildout.cfg
#     追加一次），runProfiles 不去重，需从其中一侧删掉。
#   * 重建代价看 Dockerfile 的哪一版：
#       - PR #23 之前：buildout.cfg 与 common-addons.cfg 同在 Dockerfile:50 的
#         早期 COPY 里（apt、Plone installer、全量 buildout 之前），
#         改任一个 = 近乎全量重建。
#       - PR #23（perf/dockerfile-build-layers）之后：common-addons.cfg 已从早期
#         COPY 拆出，构建期先放占位空壳，真正那份在链尾的「第二段 buildout」才
#         COPY 进来。**改本文件只打到最后一层**，几分钟；但 buildout.cfg 仍在
#         早期 COPY 里，改它照旧是全量重建。
#     —— 也就是说「改 common-addons.cfg 很贵」这条**只对旧 Dockerfile 成立**，
#     下判断前先确认手上这份 Dockerfile 是哪一版（看有没有第二段 buildout）。

[plonesite]
profiles =
    senaite.lims:default
    maitux.auditjournal:default
    maitux.branding:default
    maitux.capabilityinventory:default
    maitux.loginhelpdisable:default
    maitux.setuptitles:default
