[buildout]
# 客户定制 add-on 挂载在容器内的 /opt/addons/customers 目录
develop +=
    /opt/addons/customers/maitux.oauth2.0
    /opt/addons/customers/maitux.calcenhance
    /opt/addons/customers/maitux.esignature
    /opt/addons/customers/maitux.instrument_acquisition
    /opt/addons/customers/maitux.reviewerassignment
    /opt/addons/customers/maitux.stability
    /opt/addons/customers/maitux.stock
    /opt/addons/customers/maitux.testmodel
    /opt/addons/customers/maitux.workflow
    /opt/addons/customers/maitux.audittrail
    /opt/addons/customers/maitux.groupmanagement
    /opt/addons/customers/maitux.hazardcategories
    /opt/addons/customers/maitux.roles
    /opt/addons/customers/maitux.projects
    /opt/addons/customers/maitux.worksheet
    /opt/addons/customers/INNOCARE.arextension
    /opt/addons/customers/INNOCARE.Reportdesign
    /opt/addons/customers/INNOCARE.labeldesign

eggs +=
    maitux.oauth2
    maitux.calcenhance
    maitux.esignature
    maitux.instrument_acquisition
    maitux.reviewerassignment
    maitux.stability
    maitux.stock
    maitux.testmodel
    maitux.workflow
    maitux.audittrail
    maitux.groupmanagement
    maitux.hazardcategories
    maitux.roles
    maitux.projects
    maitux.worksheet
    INNOCARE.arextension
    INNOCARE.Reportdesign
    INNOCARE.labeldesign
[instance]
# 修复建站失败：pip 装进 site-packages 的 zope.* 带的 *-nspkg.pth 会在解释器
# 启动时往 sys.modules 塞一个只含 site-packages 路径的假 zope 模块，
# eggs 里的 zope.processlifetime 因此不可见。buildout 自动建站走的
# `bin/instance run` 子进程不 import pkg_resources，于是静默失败：
# buildout 不报错、实例照常启动，但站点没建出来，/SITE 返回 404。
# 先 import pkg_resources 即可把命名空间补齐。
#
# 注：镜像里的 buildout.cfg 也加了同样的一行，但本文件是从宿主挂载
# 进去的，所以不重建镜像也能生效（容器启动时会重跑 buildout）。
initialization =
    import pkg_resources
# 按要求排除 senaite.oidc，其余客户 add-on 全部加载
zcml +=
    maitux.oauth2
    maitux.calcenhance
    maitux.calcenhance-overrides
    maitux.esignature
    maitux.instrument_acquisition
    maitux.reviewerassignment
    maitux.stability
    maitux.stock
    maitux.testmodel
    maitux.workflow
    maitux.audittrail
    maitux.groupmanagement
    maitux.hazardcategories
    maitux.hazardcategories-overrides
    maitux.roles
    maitux.projects
    maitux.worksheet
    maitux.worksheet-overrides
    INNOCARE.arextension
    INNOCARE.labeldesign
    INNOCARE.labeldesign-overrides
[plonesite]
profiles +=
    maitux.oauth2:default
    maitux.calcenhance:default
    maitux.esignature:default
    maitux.instrument_acquisition:default
    maitux.reviewerassignment:default
    maitux.stability:default
    maitux.stock:default
    maitux.testmodel:default
    maitux.workflow:default
    maitux.audittrail:default
    maitux.groupmanagement:default
     maitux.hazardcategories:default
    maitux.roles:default
    maitux.projects:default
    maitux.worksheet:default
    INNOCARE.arextension:default
    INNOCARE.Reportdesign:default
    INNOCARE.labeldesign:default


