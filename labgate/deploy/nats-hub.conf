# 云端 NATS（Hub）配置 —— 各实验室的 labgate 以 LeafNode 接入这里。
#
# 这份配置用于本机演示与联调；正式云端建议再加上：
#   - TLS（leafnodes 段的 tls {}）
#   - 每个站点独立账号或 NKey/JWT 认证，而不是共用一组账号密码
#   - 3 节点集群 + JetStream R3，避免单点

server_name: hub

listen: 0.0.0.0:4222

jetstream {
  domain: hub
  store_dir: /data/jetstream
  max_memory_store: 256MB
  max_file_store: 10GB
}

# 边缘节点接入口。labgate 的 nats.leaf.url 指向这里。
leafnodes {
  listen: 0.0.0.0:7422

  authorization {
    user: labgate
    password: change-me-please
    timeout: 5
  }
}

# 监控端点：http://<hub>:8222/varz、/leafz、/jsz
http: 0.0.0.0:8222

max_payload: 1MB
